# Check that the commit messages are between 20 and 150 chars,
# and that they follow the rule
# <type> (<scope>): <subject>
# type: docs, feat, fix, chore, refactor, style or test
# scope (optional): any extra info, (like DMS or whatever)

name: "Commit Message Check"
on: pull_request

# The pull request cannot be merged until this check passes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-commit-message:
    name: Check Commit Message
    runs-on: ubuntu-latest
    steps:
      - name: Check Commit Format
        # gsactions is archived, but the action is still functional.
        # zizmor: ignore[archived-uses] no maintained equivalent at the moment
        uses: gsactions/commit-message-checker@16fa2d5de096ae0d35626443bcd24f1e756cafee # v2
        with:
          pattern: '^((docs|feat|fix|chore|refactor|style|test|sweep)( ?\(.*\))?: .+|Revert ".+")$'
          excludeDescription: "true" # optional: this excludes the description body of a pull request
          excludeTitle: "true" # optional: this excludes the title of a pull request
          checkAllCommitMessages: "true" # optional: this checks all commits associated with a pull request
          accessToken: ${{ secrets.GITHUB_TOKEN }} # github access token is only required if checkAllCommitMessages is true
          flags: "gim"
          error: 'Your commit has to follow the format "<type>(<scope>): <subject>"".'
      - name: Check Commit Length
        # gsactions is archived, but the action is still functional.
        # zizmor: ignore[archived-uses] no maintained equivalent at the moment
        uses: gsactions/commit-message-checker@16fa2d5de096ae0d35626443bcd24f1e756cafee # v2
        with:
          pattern: "^.{20,150}$"
          error: "Commit messages should be between 20 and 150 chars"
          excludeDescription: "true" # optional: this excludes the description body of a pull request
          excludeTitle: "true" # optional: this excludes the title of a pull request
          checkAllCommitMessages: "true" # optional: this checks all commits associated with a pull request
          accessToken: ${{ secrets.GITHUB_TOKEN }} # github access token is only required if checkAllCommitMessages is true
