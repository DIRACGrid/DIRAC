name: DIRACCommon Tests

on:
  push:
    branches:
      - integration
      - rel-*
    paths:
      - 'dirac-common/**'
      - '.github/workflows/dirac-common.yml'
  pull_request:
    branches:
      - integration
      - rel-*
    paths:
      - 'dirac-common/**'
      - '.github/workflows/dirac-common.yml'

# A new push to the same branch/PR cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-dirac-common:
    name: test-dirac-common
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # Need full history for setuptools_scm
        persist-credentials: false

    - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
      with:
        run-install: false
        post-cleanup: false

    - name: Apply workarounds
      run: |
        # Workaround for https://github.com/prefix-dev/pixi/issues/3762
        sed -i.bak 's@editable = true@editable = false@g' dirac-common/pyproject.toml
        rm dirac-common/pyproject.toml.bak
        # Show any changes
        git diff

    - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
      with:
        cache: false
        environments: testing
        manifest-path: dirac-common/pyproject.toml

    - name: Run tests with pixi
      run: |
        cd dirac-common
        pixi add --feature testing pytest-github-actions-annotate-failures
        pixi run pytest
