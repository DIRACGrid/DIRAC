name: pilot wrapper

on: [push, pull_request]

# A new push to the same branch/PR cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  PilotWrapper:
    name: PilotWrapper
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.repository == 'DIRACGrid/DIRAC'

    strategy:
      fail-fast: False
      matrix:
        # pixi environment names (see pixi.toml); the exact python versions
        # are pinned by pixi.lock
        python:
          - py36
          - py311
          - py314
        pilot_branch:
          - master
          - devel

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cvmfs-contrib/github-action-cvmfs@d705955b32075b4b0178f3a0160b6fe527483cf8 # v5

      - name: Test CernVM-FS
        run: ls /cvmfs/dirac.egi.eu

      - name: Fail-fast for outdated pipelines
        run: .github/workflows/fail-fast.sh

      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.84.1
          cache: false
          environments: ${{ matrix.python }}

      - name: run pilot wrapper test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHON_ENV: ${{ matrix.python }}
          PILOT_BRANCH: ${{ matrix.pilot_branch }}
        run: |
          export INVALID_UTF8_VAR=$'\xff'
          cp tests/Integration/WorkloadManagementSystem/Test_GenerateAndExecutePilotWrapper.py .
          # download and extract the pilot artifacts: authenticated with the
          # workflow token, so no rate limits, and no manual zip handling
          gh run download -R DIRACGrid/Pilot -n Pilot_${PILOT_BRANCH} -D ${PILOT_BRANCH}/pilot
          pixi run -e ${PYTHON_ENV} python Test_GenerateAndExecutePilotWrapper.py file://$GITHUB_WORKSPACE/src/DIRAC/WorkloadManagementSystem/Utilities/PilotWrapper.py file://$GITHUB_WORKSPACE/${PILOT_BRANCH}
