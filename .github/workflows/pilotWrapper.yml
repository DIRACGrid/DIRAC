name: pilot wrapper

on: [push, pull_request]

jobs:
  PilotWrapper:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.repository == 'DIRACGrid/DIRAC'

    strategy:
      fail-fast: False
      matrix:
        python:
          # 3.6.8 only exists in the Anaconda `defaults` channel, which Miniforge
          # deliberately does not use: 3.6.9 is the nearest build on conda-forge
          - 3.6.9
          - 3.11.4
          - 3.14.6
        pilot_branch:
          - master
          - devel

    steps:
      - uses: actions/checkout@v4
      - uses: cvmfs-contrib/github-action-cvmfs@v5

      - name: Test CernVM-FS
        run: ls /cvmfs/dirac.egi.eu

      - name: Fail-fast for outdated pipelines
        run: .github/workflows/fail-fast.sh

      # conda is no longer preinstalled (nor on the PATH) of the ubuntu-latest
      # runner images; install it explicitly since the next steps rely on it
      - name: Install conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          conda-remove-defaults: "true"
          auto-update-conda: false
          activate-environment: ""

      - name: prepare environment
        run: |
          conda config --set add_pip_as_python_dependency false
          conda create -c conda-forge -n python_${{ matrix.python }} python=${{ matrix.python }}
      - name: run pilot wrapper test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export INVALID_UTF8_VAR=$'\xff'
          cp tests/Integration/WorkloadManagementSystem/Test_GenerateAndExecutePilotWrapper.py .
          eval "$(conda shell.bash hook)" && conda activate python_${{ matrix.python }}
          # download and extract the pilot artifacts: authenticated with the
          # workflow token, so no rate limits, and no manual zip handling
          gh run download -R DIRACGrid/Pilot -n Pilot_${{ matrix.pilot_branch }} -D ${{ matrix.pilot_branch }}/pilot
          python Test_GenerateAndExecutePilotWrapper.py file://${{ github.workspace }}/src/DIRAC/WorkloadManagementSystem/Utilities/PilotWrapper.py file://${{ github.workspace }}/${{ matrix.pilot_branch }}
