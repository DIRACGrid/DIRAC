name: Deployment

# Releases: "Run workflow" on integration or a release branch creates a draft
# GitHub release. A release manager publishes it, which creates the tag, and the
# release event builds and ships it. Nothing is pushed from CI.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Override the release version number (e.g. 8.0.0a5)"
  release:
    types: [published]

# A release is never cancelled; a newer push or PR run cancels the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  draft-release:
    name: Draft the release
    runs-on: "ubuntu-latest"
    if: github.event_name == 'workflow_dispatch' && github.repository == 'DIRACGrid/DIRAC'
    permissions:
      contents: write  # create the draft GitHub release
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Installing dependencies
        run: |
          python -m pip install \
              packaging \
              python-dateutil \
              pytz \
              requests \
              setuptools_scm
      - name: Choose the version
        id: version
        env:
          EVENT_REF: ${{ github.event.ref }}
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          set -xeuo pipefail
          IFS=$'\n\t'
          if [[ ! "${EVENT_REF}" =~ ^refs/heads/(integration|rel-v([8-9]|[1-9][0-9]+)r[0-9]+)$ ]]; then
            echo "Releases are made from integration or a release branch, not ${EVENT_REF}"
            exit 2
          fi
          NEW_VERSION="v${VERSION_INPUT}"
          if [[ "${NEW_VERSION}" == "v" ]]; then
            # If version wasn't given as an input to the workflow, use setuptools_scm to guess while removing "dev" portion of the version number
            NEW_VERSION=v$(python -m setuptools_scm | sed 's@Guessed Version @@g' | sed -E 's@(\.dev|\+g).+@@g')
          fi
          echo "Release will be named $NEW_VERSION"
          python .github/workflows/check_release_version.py "${NEW_VERSION}" "${EVENT_REF#refs/heads/}"
          echo "new-version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
      - name: Prepare release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -xeuo pipefail
          IFS=$'\n\t'
          PREV_VERSION=$(git describe --tags --abbrev=0 --match '*[0-9].[0-9]*' --exclude 'v[0-9]r*' --exclude 'v[0-9][0-9]r*')
          REFERENCE_BRANCH=${GITHUB_REF#refs/heads/}
          echo "Making release notes for ${REFERENCE_BRANCH} since ${PREV_VERSION}"
          ./docs/diracdoctools/scripts/dirac-docs-get-release-notes.py \
              --token "${GITHUB_TOKEN}" \
              --sinceTag "${PREV_VERSION}" \
              --branches "${REFERENCE_BRANCH}" \
              --repo "${GH_REPO}" \
              > release.notes.new
          cat release.notes.new
      - name: Create the draft release
        env:
          NEW_VERSION: ${{ steps.version.outputs.new-version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          .github/workflows/make_release.py \
            --repo="${GH_REPO}" \
            --token="${GITHUB_TOKEN}" \
            --version="${NEW_VERSION}" \
            --rev="$(git rev-parse HEAD)" \
            --release-notes-fn="release.notes.new"

  deploy-pypi:
    name: Build
    runs-on: "ubuntu-latest"
    if: github.event_name == 'pull_request' || github.event_name == 'release' || (github.event_name == 'push' && github.repository == 'DIRACGrid/DIRAC')
    outputs:
      conda-forge-version: ${{ steps.check-tag.outputs.conda-forge-version }}
      create-release: ${{ steps.check-tag.outputs.create-release }}
      new-version: ${{ steps.check-tag.outputs.new-version }}
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Installing dependencies
        run: |
          python -m pip install \
              build \
              packaging \
              readme_renderer \
              setuptools_scm
      - name: Validate README for PyPI
        run: |
          python -m readme_renderer README.rst -o /tmp/README.html
      - name: Check the release
        id: check-tag
        env:
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -xeuo pipefail
          IFS=$'\n\t'
          if [[ "${REPO}" == "DIRACGrid/DIRAC" && "${EVENT_NAME}" == "release" ]]; then
            # The draft can be edited before it is published: check again where the tag ended up
            if [[ "$(git describe --exact-match --tags HEAD)" != "${RELEASE_TAG}" ]]; then
              echo "${RELEASE_TAG} is not the tag of the checked-out commit"
              exit 2
            fi
            BRANCH=$(python .github/workflows/check_release_version.py "${RELEASE_TAG}")
            git merge-base --is-ancestor HEAD "origin/${BRANCH}" || git merge-base --is-ancestor HEAD origin/integration
            echo "create-release=true" >> "$GITHUB_OUTPUT"
            echo "new-version=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
            # Expose the version for the conda-forge feedstock, skipping pre-releases
            CONDA_FORGE_VERSION=$(python -c $'import sys\nfrom packaging.version import Version\nv = Version(sys.argv[1])\nprint("" if v.is_prerelease else v)' "${RELEASE_TAG}")
            echo "conda-forge-version=$CONDA_FORGE_VERSION" >> "$GITHUB_OUTPUT"
          fi
      - name: Build distribution
        env:
          NEW_VERSION: ${{ steps.check-tag.outputs.new-version }}
        run: |
          if [[ -n "${NEW_VERSION}" ]]; then
            # Tell setuptools_scm the version of the released tree
            export SETUPTOOLS_SCM_PRETEND_VERSION="${NEW_VERSION#v}"
          fi
          python -m build
      - name: Upload distribution
        if: steps.check-tag.outputs.create-release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dirac-dist
          path: dist/
          retention-days: 5

  # Only this job talks to PyPI; the deployment above runs without any PyPI credential.
  publish:
    name: Publish packages to PyPI
    needs: deploy-pypi
    if: needs.deploy-pypi.outputs.create-release == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing on pypi
    steps:
      - name: Download the distribution packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dirac-dist
          path: dist/
      # Use trusted publisher for pypi
      # https://docs.pypi.org/trusted-publishers/
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  deploy_CVMFS:
    name: deploy_CVMFS
    runs-on: "ubuntu-latest"
    # Wait for the PyPI upload: sync_packages.sh must see the new release.
    # publish is skipped when no release is made; only skip CVMFS if it failed.
    if: ${{ !failure() && !cancelled() && github.event_name == 'release' }}
    needs: [deploy-pypi, publish]
    # The CVMFS proxy lives in this environment: release branches and tags only,
    # approved by a release manager.
    environment: cvmfs
    steps:
      - name: install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y fetch-crl
      # conda is no longer preinstalled (nor on the PATH) of the ubuntu-latest
      # runner images; install it explicitly since the next steps rely on it
      - name: Install conda
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4
        with:
          miniforge-version: latest
          conda-remove-defaults: "true"
          auto-update-conda: false
          activate-environment: ""

      - name: prepare environment
        run: |
          conda create -c conda-forge -n cvmfs-env ca-policy-lcg openssl==3.0.7 gct
      - name: Deploy on CVMFS
        env:
            CVMFS_PROXY_BASE64: ${{ secrets.CVMFS_PROXY_BASE64 }}
        run: |
          eval "$(conda shell.bash hook)" && conda activate cvmfs-env
          export X509_CERT_DIR=$CONDA_PREFIX/etc/grid-security/certificates
          echo "===== fetch crls, this can fail partially, should be not a problem ====="
          sudo fetch-crl -l $X509_CERT_DIR -T 30 || echo "fetch-crl is not completely successful"
          echo "$CVMFS_PROXY_BASE64" | base64 --decode > cvmfs.proxy
          export X509_USER_PROXY=cvmfs.proxy
          chmod 600 cvmfs.proxy
          export PATH=/usr/share/miniconda3/bin:/opt/conda/bin/:/opt/conda/condabin:$PATH
          type -a openssl
          openssl version
          type -a gsissh
          mkdir -p ~/.ssh/ && touch ~/.ssh/known_hosts
          ssh-keyscan cvmfs-uploader-egi.gridpp.rl.ac.uk >> ~/.ssh/known_hosts
          gsissh -p 1975 -t cvmfs-uploader-egi.gridpp.rl.ac.uk /home/diracsgm/admin/sync_packages.sh

  update-conda-forge:
    name: conda-forge feedstock update
    runs-on: "ubuntu-latest"
    # The feedstock recipe downloads the sdist from PyPI, so wait for publish.
    needs: [deploy-pypi, publish]
    if: needs.deploy-pypi.outputs.conda-forge-version != ''
    environment: conda-forge
    steps:
      - name: Update the dirac-grid feedstock
        uses: conda-forge/release@45b05fddc6addd06d5f982ebe0a88378ec44de92  # v2026.9.15
        with:
          feedstock: dirac-grid-feedstock
          version: ${{ needs.deploy-pypi.outputs.conda-forge-version }}
          github-token: ${{ secrets.CONDA_FORGE_PAT }}
          github-token-for-fork: ${{ secrets.CONDA_FORGE_FORK_PAT }}
          automerge: true
