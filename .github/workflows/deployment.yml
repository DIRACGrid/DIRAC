name: Deployment

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      check-ci:
        description: "Require the CI to have passed for this commit"
        required: true
        default: "yes"
      version:
        description: "Override the release version number (e.g. 8.0.0a5)"

# Releases (workflow_dispatch) get their own group, so a later push or PR run
# can never replace a queued release, and a running release is never
# cancelled. Push/PR runs only build, so a newer one cancels the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  deploy-pypi:
    name: PyPI deployment
    runs-on: "ubuntu-latest"
    if: github.event_name != 'push' || github.repository == 'DIRACGrid/DIRAC'
    permissions:
      contents: write  # push the release notes commit and create the GitHub release
    outputs:
      conda-forge-version: ${{ steps.check-tag.outputs.conda-forge-version }}
      create-release: ${{ steps.check-tag.outputs.create-release }}
      new-version: ${{ steps.check-tag.outputs.new-version }}
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PAT is required to push the release notes commit to the protected
          # release branches, and its persisted credentials are used for the push.
          # zizmor: ignore[secrets-outside-env,artipacked] PAT required to push to the protected release branches
          token: ${{ secrets.PAT || github.token }}
      - run: |
          git fetch --prune --unshallow
          git config --global user.email "ci@diracgrid.org"
          git config --global user.name "DIRACGrid CI"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Installing dependencies
        run: |
          python -m pip install \
              build \
              python-dateutil \
              pytz \
              readme_renderer \
              requests \
              setuptools_scm
      - name: Validate README for PyPI
        run: |
          python -m readme_renderer README.rst -o /tmp/README.html
      - name: Prepare release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -xeuo pipefail
          IFS=$'\n\t'
          PREV_VERSION=$(git describe --tags --abbrev=0 --match '*[0-9].[0-9]*' --exclude 'v[0-9]r*' --exclude 'v[0-9][0-9]r*')
          REFERENCE_BRANCH=${GITHUB_REF#refs/heads/}
          echo "Making release notes for ${REFERENCE_BRANCH} since ${PREV_VERSION}"
          ./docs/diracdoctools/scripts/dirac-docs-get-release-notes.py \
              --token "${GITHUB_TOKEN}" \
              --sinceTag "${PREV_VERSION}" \
              --branches "${REFERENCE_BRANCH}" \
              --repo "${GH_REPO}" \
              > release.notes.new
          cat release.notes.new
      - name: Create tag if required
        id: check-tag
        env:
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.event.ref }}
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          set -xeuo pipefail
          IFS=$'\n\t'
          # Only do a real release for workflow_dispatch events from DIRACGrid/DIRAC for integration for Python 3 compatible branches
          if [[ "${REPO}" == "DIRACGrid/DIRAC" ]]; then
            if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
              if [[ "${EVENT_REF}" =~ ^refs/heads/(integration|rel-v([8-9]|[1-9][0-9]+)r[0-9]+)$ ]]; then
                echo "Will create a real release"
                export NEW_VERSION="v${VERSION_INPUT}"
                if [[ "${NEW_VERSION}" == "v" ]]; then
                  # If version wasn't given as an input to the workflow, use setuptools_scm to guess while removing "dev" portion of the version number
                  NEW_VERSION=v$(python -m setuptools_scm | sed 's@Guessed Version @@g' | sed -E 's@(\.dev|\+g).+@@g')
                  export NEW_VERSION
                fi
                echo "Release will be named $NEW_VERSION"
                # Validate the version
                # Ensure the version doesn't look like a PEP-440 "dev release" (which might happen if the automatic version bump has issues)
                python -c $'from packaging.version import Version; v = Version('"'$NEW_VERSION'"$')\nif v.is_devrelease:\n    raise ValueError(v)'
                if [[ "${EVENT_REF}" =~ ^refs/heads/integration$ ]]; then
                  # If we're releasing from integration it must be a pre-release
                  python -c $'from packaging.version import Version; v = Version('"'$NEW_VERSION'"$')\nif not v.is_prerelease:\n    raise ValueError("integration should only be used for pre-releases")'
                elif [[ "${EVENT_REF}" != "$(python -c $'from packaging.version import Version; v = Version('"'$NEW_VERSION'"$')\nprint(f"refs/heads/rel-v{v.major}r{v.minor}")')" ]]; then
                  # If we're not releasing from integration the version should match the rel-vXrY branch name
                  echo "$NEW_VERSION is an invalid version for ${EVENT_REF}"
                  exit 2
                fi
                # Commit the release notes
                mv release.notes release.notes.old
                {
                  echo -e "[${NEW_VERSION}]" && \
                  tail -n +2 release.notes.new | perl -0777pe 's/\n+$/\n\n/' && \
                  cat release.notes.old;
                } > release.notes
                git add release.notes
                git commit -m "docs: Add release notes for $NEW_VERSION"
                git show
                # Create the tag
                git tag "$NEW_VERSION"
                echo "create-release=true" >> $GITHUB_OUTPUT
                echo "new-version=$NEW_VERSION" >> $GITHUB_OUTPUT
                # Expose the version for the conda-forge feedstock, skipping pre-releases
                CONDA_FORGE_VERSION=$(python -c $'from packaging.version import Version; v = Version('"'$NEW_VERSION'"$')\nprint("" if v.is_prerelease else v)')
                echo "conda-forge-version=$CONDA_FORGE_VERSION" >> $GITHUB_OUTPUT
              fi
            fi
          fi
      - name: Build distributions
        run: |
          python -m build
      - name: Upload Artifact
        if: steps.check-tag.outputs.create-release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dirac-dist
          path: dist/
          retention-days: 5
      - name: Make release on GitHub
        if: steps.check-tag.outputs.create-release == 'true'
        env:
          NEW_VERSION: ${{ steps.check-tag.outputs.new-version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          echo "Pushing tagged release notes to ${GITHUB_REF#refs/heads/}"
          git push "origin" "${GITHUB_REF#refs/heads/}"
          echo "Making GitHub release for ${NEW_VERSION}"
          .github/workflows/make_release.py \
            --repo="${GH_REPO}" \
            --token="${GITHUB_TOKEN}" \
            --version="${NEW_VERSION}" \
            --rev="$(git rev-parse HEAD)" \
            --release-notes-fn="release.notes.new"

  # Only this job talks to PyPI; the deployment above runs without any PyPI credential.
  publish:
    name: Publish package on PyPI
    needs: deploy-pypi
    if: needs.deploy-pypi.outputs.create-release == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing on pypi
    steps:
      - name: Download the distribution packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dirac-dist
          path: dist/
      # Use trusted publisher for pypi
      # https://docs.pypi.org/trusted-publishers/
      - name: Publish package on PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  deploy_CVMFS:
    name: deploy_CVMFS
    runs-on: "ubuntu-latest"
    # Wait for the PyPI upload: sync_packages.sh must see the new release.
    # publish is skipped when no release is made; only skip CVMFS if it failed.
    if: ${{ !failure() && !cancelled() && github.event_name == 'workflow_dispatch' }}
    needs: [deploy-pypi, publish]
    # The CVMFS proxy lives in this environment: release branches and tags only,
    # approved by a release manager.
    environment: cvmfs
    steps:
      # conda is no longer preinstalled (nor on the PATH) of the ubuntu-latest
      # runner images; install it explicitly since the next steps rely on it
      - name: Install conda
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4
        with:
          miniforge-version: latest
          conda-remove-defaults: "true"
          auto-update-conda: false
          activate-environment: ""

      - name: prepare environment
        run: |
          conda create -c conda-forge -n cvmfs-env ca-policy-lcg openssl==3.0.7 gct
      - name: Deploy on CVMFS
        env:
            CVMFS_PROXY_BASE64: ${{ secrets.CVMFS_PROXY_BASE64 }}
        run: |
          eval "$(conda shell.bash hook)" && conda activate cvmfs-env
          conda install ca-policy-lcg openssl==3.0.7 gct
          echo "$CVMFS_PROXY_BASE64" | base64 --decode > cvmfs.proxy
          export X509_USER_PROXY=cvmfs.proxy
          chmod 600 cvmfs.proxy
          export PATH=/usr/share/miniconda3/bin:/opt/conda/bin/:/opt/conda/condabin:$PATH
          type -a openssl
          openssl version
          type -a gsissh
          mkdir -p ~/.ssh/ && touch ~/.ssh/known_hosts
          ssh-keyscan cvmfs-upload01.gridpp.rl.ac.uk >> ~/.ssh/known_hosts
          gsissh -p 1975 -t cvmfs-upload01.gridpp.rl.ac.uk /home/diracsgm/admin/sync_packages.sh -v

  update-conda-forge:
    name: conda-forge feedstock update
    runs-on: "ubuntu-latest"
    # The feedstock recipe downloads the sdist from PyPI, so wait for publish.
    needs: [deploy-pypi, publish]
    if: needs.deploy-pypi.outputs.conda-forge-version != ''
    environment: conda-forge
    steps:
      - name: Update the dirac-grid feedstock
        uses: conda-forge/release@45b05fddc6addd06d5f982ebe0a88378ec44de92  # v2026.9.15
        with:
          feedstock: dirac-grid-feedstock
          feedstock-branch: v8.0.x
          version: ${{ needs.deploy-pypi.outputs.conda-forge-version }}
          github-token: ${{ secrets.CONDA_FORGE_PAT }}
          github-token-for-fork: ${{ secrets.CONDA_FORGE_FORK_PAT }}
          automerge: true
