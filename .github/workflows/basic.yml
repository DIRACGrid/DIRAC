name: Basic tests

on: [push, pull_request]

# A new push to the same branch/PR cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.repository == 'DIRACGrid/DIRAC'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.repository == 'DIRACGrid/DIRAC'
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run shellcheck
        # TODO This should cover more than just tests/CI
        # Excluded codes related to sourcing files
        #     SC1090: Can't follow non-constant source
        #     SC1091: Not following sourced file
        run: |
          find tests/CI -name '*.sh' -print0 | xargs -0 -n1 shellcheck --exclude=SC1090,SC1091 --external-source

  pycodestyle:
    name: pycodestyle
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.repository == 'DIRACGrid/DIRAC'
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Installing dependencies
        run: |
          python -m pip install pycodestyle
      - name: Run pycodestyle
        run: |
          if [[ "${REFERENCE_BRANCH}" != "" ]]; then
              git remote add upstream https://github.com/DIRACGrid/DIRAC.git
              git fetch --no-tags upstream "${REFERENCE_BRANCH}"
              git branch -vv
              git diff -U0 "upstream/${REFERENCE_BRANCH}" ':(exclude)tests/formatting/pep8_bad.py' | pycodestyle --diff
          fi

  check:
    name: check (${{ matrix.command }})
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.repository == 'DIRACGrid/DIRAC'
    timeout-minutes: 30

    strategy:
      fail-fast: False
      matrix:
        command:
          # TODO These three tests fail on Python 3:
          #   * `test_BaseType_Unicode` and `test_nestedStructure` fail due to
          #     DISET's string and unicode types being poorly defined
          - pytest --runslow -k 'not test_BaseType_Unicode and not test_nestedStructure'
          - pylint -j 0 -E src/
          - mypy

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fail-fast for outdated pipelines
        run: .github/workflows/fail-fast.sh
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          cache: true

      - name: Run tests
        run: |
          # FIXME: The unit tests currently only work with editable installs
          # Install DIRACCommon first to ensure dependencies are resolved correctly
          pixi run python -m pip install -e ./dirac-common[testing]
          pixi run python -m pip install -e .[server,testing]
          # eval is needed to re-parse the shell quoting (e.g. -k 'not A and not B')
          # which is lost by the plain $COMMAND expansion
          eval "pixi run $COMMAND"
        env:
          REFERENCE_BRANCH: ${{ github['base_ref'] || github['head_ref'] }}
          COMMAND: ${{ matrix.command }}

  check-py314:
    name: check-py314 (${{ matrix.command }})
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.repository == 'DIRACGrid/DIRAC'
    timeout-minutes: 30

    strategy:
      fail-fast: False
      matrix:
        command:
          # TODO These three tests fail on Python 3:
          #   * `test_BaseType_Unicode` and `test_nestedStructure` fail due to
          #     DISET's string and unicode types being poorly defined
          - pytest --runslow -k 'not test_BaseType_Unicode and not test_nestedStructure'
          - pylint -j 0 -E src/

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fail-fast for outdated pipelines
        run: .github/workflows/fail-fast.sh
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          cache: true
          environments: py314

      - name: Run tests
        run: |
          # FIXME: The unit tests currently only work with editable installs
          # Install DIRACCommon first to ensure dependencies are resolved correctly
          pixi run -e py314 python -m pip install -e ./dirac-common[testing]
          pixi run -e py314 python -m pip install -e .[server,testing]
          # eval is needed to re-parse the shell quoting (e.g. -k 'not A and not B')
          # which is lost by the plain $COMMAND expansion
          eval "pixi run -e py314 $COMMAND"
        env:
          REFERENCE_BRANCH: ${{ github['base_ref'] || github['head_ref'] }}
          COMMAND: ${{ matrix.command }}

  diracx:
    name: DiracX Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DIRAC
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: DIRAC
          persist-credentials: false
      - name: Checkout DiracX
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: DIRACGrid/diracx
          path: diracx
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          cache: false
          post-cleanup: false
          manifest-path: diracx/pixi.toml
          environments: >-
            diracx-core
            diracx-db
            diracx-logic
            diracx-tasks
            diracx-routers
            diracx-client
            diracx-api
            diracx-cli
      - name: Apply workarounds
        run: |
          cd diracx
          # Workaround for https://github.com/prefix-dev/pixi/issues/3762
          sed -i.bak 's@editable = true@editable = false@g' pixi.toml
          rm pixi.toml.bak
          # Drop the gubbins environments entirely: this job doesn't use them, and the
          # `pixi add --feature diracx-core` calls below would otherwise re-solve them too
          sed -i.bak '/solve-group = "gubbins"/d' pixi.toml
          rm pixi.toml.bak
          # The gubbins environments are removed above; drop the task that references them
          awk '/^\[tasks\.pytest-gubbins-all-one-by-one\]/{skip=1;next} skip&&/^\[/{skip=0} !skip' pixi.toml > pixi.toml.new
          mv pixi.toml.new pixi.toml
          # Add annotations to github actions
          pixi add --pypi --feature diracx-core pytest-github-actions-annotate-failures
          # Add the current DIRAC clone to the pixi.toml
          pixi add --pypi --feature diracx-core 'DIRACCommon @ file://'$PWD'/../DIRAC/dirac-common'
          pixi add --pypi --feature diracx-core 'DIRAC @ file://'$PWD'/../DIRAC'
          # Show any changes
          git diff
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          cache: false
          locked: false
          manifest-path: diracx/pixi.toml
          environments: >-
            diracx-core
            diracx-db
            diracx-logic
            diracx-tasks
            diracx-routers
            diracx-client
            diracx-api
            diracx-cli
      - name: Run pytest
        run: cd diracx && pixi run pytest-diracx-all-one-by-one
