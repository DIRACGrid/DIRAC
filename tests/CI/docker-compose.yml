volumes:
  # Volume used to store the certificates of dirac
  certs_data:
  # Volume used to store the config of diracx
  diracx-cs-store:
  # Volume used to store the pair of keys to sign the tokens
  diracx-key-store:
  # Volume used to store the jwks of the IAM service
  diracx-iam-key-store:

services:
  mysql:
    platform: linux/amd64
    image: ${MYSQL_VER}
    container_name: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=password
    ports:
      - 3306:3306
    healthcheck:
      test: ["CMD", "sh", "-c", "${MYSQL_ADMIN_COMMAND} ping -h localhost > /tmp/health.log 2>&1;"]
      timeout: 20s
      retries: 10
      start_period: 60s
    pull_policy: always

  opensearch:
    platform: ${ES_PLATFORM}
    image: ${ES_VER}
    container_name: opensearch
    hostname: opensearch
    ports:
      - 9200:9200
    env_file: "${ES_VER}.env"
    healthcheck:
      test: ["CMD", "curl", "-f", "-u", "elastic:changeme", "http://localhost:9200"]
      interval: 5s
      timeout: 2s
      retries: 15
      start_period: 150s
    pull_policy: always

  iam-login-service:
    platform: linux/amd64
    image: ${IAM_VER}
    container_name: iam-login-service
    hostname: iam-login-service
    ports:
      - 8080:8080
    env_file: "${IAM_VER}.env"
    volumes:
      - diracx-iam-key-store:/etc/indigo-iam/keystore
    depends_on:
      - iam-init-keystore
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/.well-known/openid-configuration"]
      interval: 5s
      timeout: 2s
      retries: 15
      start_period: 60s
    pull_policy: always

  iam-init-keystore:
    platform: linux/amd64
    image: alpine:latest
    container_name: iam-init-keystore
    volumes:
      - diracx-iam-key-store:/jwks
    command: >
      sh -c 'mkdir -p /jwks && echo "{
        \"keys\": [
          {
            \"p\": \"1vffpIvQ67Bp1XmnxuuNhgHGoS4iCEbEJN9kV2oh39xRMw2L1Fx6RrgHb0t04KAE4IT_48Y9grta7OHUty4dMQ\",
            \"kty\": \"RSA\",
            \"q\": \"v673PmzSoiClcZ6U8Rcb4GyB1H76jfY3dTdZNBT5cSVEPhPCnGNWXFKPUj5qeT4CGneR9tdGU7U-_vRNPJg9yw\",
            \"d\": \"XC1QH6W--Hh9fIsswXB2H0S44GvbrVD75XiJwrOgmrOhBK8MFR0X_eQ-9nBNPmZbAu9NKK5ixwIcE8J-OhQaOcDkepAf1DUo6iIlXgtbHvOtT3GHNgPHJ4C7XbnO9ieNDMrMr2tpmGnH2sebvXwLrzjKJCB09bS6yj71XGkyVKE\",
            \"e\": \"AQAB\",
            \"kid\": \"rsa1\",
            \"qi\": \"P8KH-16jsDjJygzggeLxlJwHYFYPoie3hgB__aajO03GiRzYJojD5dBKEiQuo9SxJ43U5csHWYQeukz9X01-zw\",
            \"dp\": \"VYF6_6RtkZI2RqeBSOpg_LCwJWSIPOqJEnGZI_wfRUAJPFljCTFPodmJe4d0EfUUe4nrjtpHlTyYyih5x_MbwQ\",
            \"dq\": \"sxzUTZG0dOjaj8PmWy4Dz361BpIsoDC9e5tfkGo0-AQhs3wVcrrkPNqsr-ZA6dAGeSLX0vcv8RJArk4sSf3cZw\",
            \"n\": \"oPXb81pZRmxmRJVHva49e5-NOToDdZ6XITpqt3RF-Ovehkd52Fm-t0FfKjJZxP7Q4d-nw1gk-r894uRJPAU9mx3yya9p7L5Xnr6rs8jmf_KF2buaYMUQ001wpsjJwznyGHWNqrBNB4_2-3U_uMGWyJB-C8Gy2-3aXjHRSQ-d0ts\"
          }
        ]
      }" > /jwks/iam-keystore.jwks'
    pull_policy: always

  # Mock of an S3 storage
  s3-direct:
    platform: linux/amd64
    # Fix the version until https://github.com/adobe/S3Mock/issues/2321
    # is resolved
    image: adobe/s3mock:3.12.0
    container_name: s3-direct
    hostname: s3-direct
    ports:
      - 9090
      - 9191
    environment:
      - initialBuckets=my-first-bucket
      - debug=true
    pull_policy: always

  diracx-wait-for-db:
    platform: linux/amd64
    image: ${MYSQL_VER}
    container_name: diracx-wait-for-db
    depends_on:
      mysql:
        condition: service_healthy
    command: /home/dirac/LocalRepo/ALTERNATIVE_MODULES/DIRAC/tests/CI/check_db_initialized.sh

  dirac-init-certificates:
    platform: linux/amd64
    image: ghcr.io/diracgrid/management/certificates-generation:latest
    container_name: dirac-init-certificates
    volumes:
      - certs_data:/ca/certs/
    entrypoint: |
      /entrypoint.sh
    pull_policy: always

  dirac-server:
    platform: linux/amd64
    image: ${CI_REGISTRY_IMAGE}/${HOST_OS}-dirac
    container_name: server
    hostname: server
    user: "${DIRAC_UID}:${DIRAC_GID}"

    depends_on:
      mysql:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      s3-direct:
        condition: service_started
      iam-login-service:
        condition: service_healthy
      dirac-init-certificates:
        condition: service_completed_successfully # Let the init container create the certificates
      diracx-init-keystore:
        condition: service_completed_successfully # Let the init container create the signing key
      diracx-init-cs:
        condition: service_completed_successfully # Let the init container create the cs
    ulimits:
      nofile: 8192
    volumes:
      - certs_data:/ca/certs
      - diracx-cs-store:/cs_store
      - diracx-key-store:/keystore
    environment:
      - DIRACX_CONFIG_BACKEND_URL=git+file:///cs_store/initialRepo
      - DIRACX_SERVICE_AUTH_TOKEN_KEYSTORE=file:///keystore/jwks.json
    command: ["sleep", "infinity"] # This is necessary because of the issue described in https://github.com/moby/moby/issues/42275. What is added here is a hack/workaround.
    pull_policy: always


  dirac-client:
    platform: linux/amd64
    image: ${CI_REGISTRY_IMAGE}/${HOST_OS}-dirac
    container_name: client
    hostname: client
    user: "${DIRAC_UID}:${DIRAC_GID}"
    depends_on:
      - dirac-server
    volumes:
      - certs_data:/ca/certs
    ulimits:
      nofile: 8192
    command: ["sleep", "infinity"] # This is necessary because of the issue described in https://github.com/moby/moby/issues/42275. What is added here is a hack/workaround.
    pull_policy: always

  dirac-pilot:
    platform: linux/amd64
    image: ${CI_REGISTRY_IMAGE}/${HOST_OS}-dirac
    container_name: pilot
    hostname: pilot
    user: "${DIRAC_UID}:${DIRAC_GID}"
    depends_on:
      - dirac-server
    volumes:
      - certs_data:/ca/certs
      - type: bind
        source: ${CVMFS_DIR}
        target: /cvmfs
        bind:
          propagation: rslave
    ulimits:
      nofile: 8192
    pull_policy: always
    healthcheck:
      test: ["CMD", "ls ${CVMFS_DIR} > /tmp/health.log 2>&1;"]
      timeout: 20s
      retries: 10
      start_period: 60s
    command: ["sleep", "infinity"] # This is necessary because of the issue described in https://github.com/moby/moby/issues/42275. What is added here is a hack/workaround.


  diracx-chmod:
    platform: linux/amd64
    image: ghcr.io/diracgrid/diracx/secret-generation:latest
    container_name: diracx-chmod
    volumes:
      # As the diracx images don't run as root we need to change the permissions of the directories as well
      - diracx-key-store:/keystore/
      - diracx-cs-store:/cs_store/
    # We need to allow everybody to read the private keys
    # Because the users are different between the DIRAC and DiracX containers
    entrypoint: |
      bash -xc 'chmod -R o=u /keystore && chmod -R o=u /cs_store'
    pull_policy: always


  diracx-init-keystore:
    platform: linux/amd64
    image: ghcr.io/diracgrid/diracx/services:dev
    container_name: diracx-init-keystore
    depends_on:
      diracx-chmod:
        condition: service_completed_successfully # Let the init container set the permission on /keystore/
    environment:
      - DIRACX_SERVICE_AUTH_TOKEN_KEYSTORE="file:///keystore/jwks.json"
    volumes:
      - diracx-key-store:/keystore/
    entrypoint: |
      /entrypoint.sh bash -xc 'python -m diracx.logic rotate-jwk --jwks-path /keystore/jwks.json'
    pull_policy: always

  diracx-init-cs:
    platform: linux/amd64
    image: ghcr.io/diracgrid/diracx/client:dev
    container_name: diracx-init-cs
    depends_on:
      diracx-chmod:
        condition: service_completed_successfully # Let the init container set the permission on /cs_store/
      diracx-init-keystore:
        condition: service_completed_successfully # Let the init container create the signing key
    environment:
      - DIRACX_CONFIG_BACKEND_URL=git+file:///cs_store/initialRepo
      - DIRACX_SERVICE_AUTH_TOKEN_KEYSTORE=file:///keystore/jwks.json
    volumes:
      - diracx-cs-store:/cs_store/
      - diracx-key-store:/keystore/
    entrypoint: |
      /entrypoint.sh bash -xc 'dirac internal generate-cs /cs_store/initialRepo'
    pull_policy: always

  diracx-init-db:
    platform: linux/amd64
    image: ghcr.io/diracgrid/diracx/services:dev
    container_name: diracx-init-db
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DIRACX_DB_URL_AUTHDB=mysql+aiomysql://Dirac:Dirac@mysql/DiracXAuthDB
    entrypoint: |
      /entrypoint.sh bash -xc 'python3 -c "
      import pymysql
      db = pymysql.connect(host=\"mysql\", user=\"root\", password=\"password\")
      c = db.cursor()
      c.execute(\"CREATE USER IF NOT EXISTS Dirac@\\x27%%\\x27 IDENTIFIED BY \\x27Dirac\\x27\")
      c.execute(\"CREATE DATABASE DiracXAuthDB\")
      c.execute(\"GRANT SELECT,INSERT,LOCK TABLES,UPDATE,DELETE,CREATE,DROP,ALTER,REFERENCES,CREATE VIEW,SHOW VIEW,INDEX,TRIGGER,ALTER ROUTINE,CREATE ROUTINE ON DiracXAuthDB.* TO Dirac@\\x27%%\\x27\")
      db.commit()
      " && python -m diracx.db init-sql && python -m diracx.db init-os'
    pull_policy: always

  diracx:
    platform: linux/amd64
    image: ghcr.io/diracgrid/diracx/services:dev
    container_name: diracx
    environment:
      - DIRACX_CONFIG_BACKEND_URL=git+file:///cs_store/initialRepo
      - DIRACX_DB_URL_AUTHDB=mysql+aiomysql://Dirac:Dirac@mysql/DiracXAuthDB
      - DIRACX_DB_URL_JOBDB=mysql+aiomysql://Dirac:Dirac@mysql/JobDB
      - DIRACX_DB_URL_JOBLOGGINGDB=mysql+aiomysql://Dirac:Dirac@mysql/JobLoggingDB
      - DIRACX_DB_URL_SANDBOXMETADATADB=mysql+aiomysql://Dirac:Dirac@mysql/SandboxMetadataDB
      - DIRACX_DB_URL_PILOTAGENTSDB=mysql+aiomysql://Dirac:Dirac@mysql/PilotAgentsDB
      - DIRACX_DB_URL_TASKQUEUEDB=mysql+aiomysql://Dirac:Dirac@mysql/TaskQueueDB
      - DIRACX_SERVICE_AUTH_TOKEN_KEYSTORE=file:///keystore/jwks.json
      - DIRACX_SERVICE_AUTH_TOKEN_ISSUER=http://diracx:8000
      - DIRACX_SERVICE_AUTH_ALLOWED_REDIRECTS=["http://diracx:8000/docs/oauth2-redirect"]
      # Obtained with head -c 32 /dev/urandom | base64
      - DIRACX_SERVICE_AUTH_STATE_KEY=uSNPPtZ1EbC5np13zOwmWJ84Duix753Hejzk/u/MQE4=
      # Obtained with echo 'InsecureChangeMe' | base64 -d | openssl sha256
      - DIRACX_LEGACY_EXCHANGE_HASHED_API_KEY=07cddf6948d316ac9d186544dc3120c4c6697d8f994619665985c0a5bf76265a
      - 'DIRACX_OS_DB_JOBPARAMETERSDB={"hosts": "elastic:changeme@opensearch:9200", "use_ssl": false, "verify_certs": false}'
      - DIRACX_SANDBOX_STORE_BUCKET_NAME=sandboxes
      - DIRACX_SANDBOX_STORE_AUTO_CREATE_BUCKET=true
      - 'DIRACX_SANDBOX_STORE_S3_CLIENT_KWARGS={"endpoint_url": "http://s3-direct:9090", "aws_access_key_id": "console", "aws_secret_access_key": "console123"}'

      # Currently, we use a mysql DB for pilot logs. Later in DiracX we'll use opensearch.
      - 'DIRACX_OS_DB_PILOTLOGSDB={"sqlalchemy_dsn": "mysql+aiomysql://Dirac:Dirac@mysql/PilotLogsDB"}'
      # - 'DIRACX_OS_DB_PILOTLOGSDB={"hosts": "elastic:changeme@opensearch:9200", "use_ssl": false, "verify_certs": false}'

    ports:
      - 8000:8000
    depends_on:
      diracx-init-db:
        condition: service_completed_successfully
      diracx-wait-for-db:
        condition: service_completed_successfully
    volumes:
      - diracx-cs-store:/cs_store/
      - diracx-key-store:/keystore/
    entrypoint: |
      /entrypoint.sh bash -xc 'uvicorn --factory diracx.routers:create_app --host=0.0.0.0'

    healthcheck:
      test: ["CMD", "/entrypoint.sh", "python", "-c", "import requests; requests.get('http://localhost:8000/.well-known/openid-configuration').raise_for_status()"]
      interval: 5s
      timeout: 2s
      retries: 15
      start_period: 60s
    pull_policy: always
