name: dirac-development

channels:
  - diracgrid
  - conda-forge
  - nodefaults

dependencies:
  # Temporary workarounds
  # runtime
  - python =3.11
  - pip
  - apache-libcloud
  - boto3
  - cachetools
  - certifi
  - cmreshandler >1.0.0b4
  - cwltool
  - db12
  - opensearch-py
  - fabric
  - fts3
  - gitpython >=2.1.0
  - invoke
  - cryptography >=47.0.0
  # m2crypto, pyasn1 and pyasn1-modules are only needed for the legacy
  # M2Crypto based implementation (DIRAC_USE_M2CRYPTO=Yes)
  - m2crypto >=0.38.0
  - pyasn1 >0.4.1
  - pyasn1-modules
  - matplotlib
  - numpy
  - paramiko
  - pexpect >=4.0.1
  - pillow
  - prompt-toolkit >=3,<4
  - psutil >=4.2.0
  - pydantic >=2
  - python-json-logger >=0.1.8
  - pytz >=2015.7
  - pyyaml
  - recommonmark
  - requests >=2.9.1
  - sqlalchemy
  - stomp.py
  - suds >=0.6
  # Workaround for suds-jurko no longer being maintained
  - suds-jurko-compat
  - xmltodict
  - pycurl
  - voms
  - python-gfal2
  # Workaround for https://github.com/DIRACGrid/DIRAC/issues/6978
  - mysqlclient >=2.2.0
  - diraccfg
  - ldap3
  - importlib_resources
  - typing_extensions >=4.3.0
  # testing and development
  - pre-commit
  - coverage
  - docker-compose
  - hypothesis
  - ipython
  - make
  - mock
  - parameterized
  - pylint
  - pyparsing >=2.0.6
  - pytest >=3.6
  - pytest-cov >=2.2.0
  - pytest-mock
  - pytest-rerunfailures
  - setuptools-scm
  - shellcheck
  - typer
  - typer-cli
  # docs
  - pygments >=1.5
  # Until https://github.com/sphinx-doc/sphinx/issues/14548 is fixed
  - sphinx <9.0.0
  - graphviz
  # RTD Sphinx theme
  - sphinx_rtd_theme
  # Bootstrap and new elements fo Sphinx
  - sphinx-design
  # unused
  - funcsigs
  - jinja2
  # PyPI deployment
  - readme_renderer
  - twine
  - uritemplate
  # - readline >=6.2.4 in the standard library
  - simplejson >=3.8.1
  # tornado is installed with pip below: the DIRACGrid fork is needed for the
  # legacy M2Crypto based implementation (DIRAC_USE_M2CRYPTO=Yes) and behaves
  # as the standard tornado >=5.1.1,<6.0.0 otherwise
  #- tornado >=5.1.1,<6.0.0
  - typing >=3.6.6
  - rucio-clients >=34.4.2
  # For mypy
  - mypy >=0.982
  - types-cachetools
  - types-python-dateutil
  - types-pytz
  - types-pyyaml
  - types-requests
  - types-setuptools
  - pip:
    # Prerelease of the required package for integration of OAuth2
    - Authlib >=1.0.0
    - dominate
    - pyjwt
    # The following two packages are only needed for the legacy M2Crypto
    # based implementation (DIRAC_USE_M2CRYPTO=Yes)
    # This is a fork of tornado with a patch to allow for configurable iostream
    - git+https://github.com/DIRACGrid/tornado.git@iostreamConfigurable
    # This is an extension of Tornado to use M2Crypto
    # It should eventually be part of DIRACGrid
    - git+https://github.com/DIRACGrid/tornado_m2crypto
    - -e .[server]
    - -e ./dirac-common/
    # Add diracdoctools
    - -e docs/
