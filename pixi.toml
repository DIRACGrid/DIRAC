# Pixi environments used by the CI check jobs (.github/workflows/basic.yml).
# The dependency set mirrors environment.yml (conda packages from the
# `diracgrid` + `conda-forge` channels, plus the pip-only pieces: the DIRACGrid
# tornado forks and Authlib). Renovate keeps pixi.lock fresh, and
# `exclude-newer` enforces the release-age cooldown at solve time.

[workspace]
channels = [
  "diracgrid",
  "conda-forge",
]
platforms = ["linux-64"]
exclude-newer = "7d"

[feature.py311.dependencies]
python = "3.11.*"

# Python 3.6 is still tested for the pilot wrapper (used by older pilots):
# 3.6.9 is the nearest build to the 3.6.8 that only exists in the removed
# Anaconda `defaults` channel
[feature.py36.dependencies]
python = "3.6.*"

[feature.py314.dependencies]
python = "3.14.*"

[environments]
default = { features = ["py311"] }
# the pilot wrapper test only needs a bare python, so py36 skips the shared
# dependencies (they require python >= 3.9)
py36 = { features = ["py36"], no-default-feature = true }
py314 = { features = ["py314"] }

