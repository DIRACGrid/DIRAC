[pypi-dependencies]
# >=1.9.0 for CVE-2026-96760 (JWS JSON signature bypass)
Authlib = ">=1.9.0"
dominate = "*"
pyjwt = "*"
# Forks of tornado used by DIRAC: configurable iostream + M2Crypto SSL support
tornado = { git = "https://github.com/DIRACGrid/tornado.git", rev = "iostreamConfigurable" }
tornado-m2crypto = { git = "https://github.com/DIRACGrid/tornado_m2crypto.git" }
